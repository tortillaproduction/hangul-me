# SPA 用の静的配信設定。
# React Router のパスを直接開かれてもよいよう、未知のパスは index.html に返す。
server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # ビルド成果物はハッシュ付きなので長期キャッシュしてよい
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
